<text x="24" y="530" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Mons Mouton Plateau Sun path, 57 real samples. Gold above the horizon, dashed grey below it.</text>
<text x="560" y="110" fill="#e2e8f0" font-size="15" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">SVG polar plot (src/nav.c)</text>
<text x="560" y="136" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">r = R (12 - el) / 18</text>
<text x="560" y="158" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x = cx + r sin(az)</text>
<text x="560" y="180" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">y = cy - r cos(az)</text>
<text x="560" y="202" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">center +12 deg, edge -6 deg,</text>
<text x="560" y="224" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">horizon ring at 2/3 R</text>
<text x="560" y="264" fill="#e2e8f0" font-size="15" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">GLSL fisheye dome (kernel)</text>
<text x="560" y="290" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">el = 90 - r x 100</text>
<text x="560" y="312" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">az = atan(ndc.x, ndc.y)</text>
<text x="560" y="334" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">center zenith, edge -10 deg,</text>
<text x="560" y="356" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">horizon ring at 0.9 R</text>
<text x="560" y="378" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">d = (cos el sin az, sin el,</text>
<text x="560" y="400" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">     cos el cos az)</text>
<text x="560" y="440" fill="#e2e8f0" font-size="15" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Up-hours (body_metrics)</text>
<text x="560" y="466" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">frac = (0 - e0) / (e1 - e0)</text>
<text x="560" y="488" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">above = frac dt  or  (1-frac) dt</text>
<text x="560" y="510" fill="#f59e0b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">summed over 6 h intervals</text>
</svg>