<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="System architecture: Horizons data to navigator page">
<rect width="1200" height="620" fill="#0b1020"/>
<text x="24" y="40" fill="#e2e8f0" font-size="20" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">System architecture — data in, decision out</text>
<rect x="24" y="70" width="200" height="64" rx="10" fill="#111a2e" stroke="#E03C31" stroke-width="1.5"/><text x="38" y="96" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">JPL Horizons API</text><text x="38" y="118" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ssd.jpl.nasa.gov/api</text>
<line x1="224" y1="102" x2="244" y2="102" stroke="#94a3b8" stroke-width="1.5"/><polygon points="244,102 236,98 236,106" fill="#94a3b8"/>
<rect x="244" y="70" width="190" height="64" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/><text x="258" y="96" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">data/fetch.sh</text><text x="258" y="118" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">18 queries, 6-hourly</text>
<line x1="434" y1="102" x2="454" y2="102" stroke="#94a3b8" stroke-width="1.5"/><polygon points="454,102 446,98 446,106" fill="#94a3b8"/>
<rect x="454" y="70" width="200" height="64" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/><text x="468" y="96" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">data/raw/ + csv/</text><text x="468" y="118" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">18 txt, 18 csv, 1,026 rows</text>
<line x1="654" y1="102" x2="674" y2="102" stroke="#94a3b8" stroke-width="1.5"/><polygon points="674,102 666,98 666,106" fill="#94a3b8"/>
<rect x="674" y="70" width="210" height="64" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/><text x="688" y="96" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">src/nav.c</text><text x="688" y="118" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">C11, stdlib only</text>
<line x1="884" y1="102" x2="904" y2="102" stroke="#94a3b8" stroke-width="1.5"/><polygon points="904,102 896,98 896,106" fill="#94a3b8"/>
<rect x="904" y="70" width="272" height="64" rx="10" fill="#111a2e" stroke="#4ade80" stroke-width="1.5"/><text x="918" y="96" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Decision model</text><text x="918" y="118" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">guards, score, rank</text>
<rect x="674" y="180" width="210" height="64" rx="10" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/><text x="688" y="206" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">data/sites.tsv</text><text x="688" y="228" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">9 regions, lon/lat</text>
<line x1="779" y1="180" x2="779" y2="134" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="904" y="180" width="272" height="64" rx="10" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/><text x="918" y="206" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">data/science.tsv</text><text x="918" y="228" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FeO / Al2O3 wt%</text>
<line x1="1040" y1="180" x2="1040" y2="134" stroke="#94a3b8" stroke-width="1.5"/>
<text x="24" y="248" fill="#94a3b8" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">First nav run writes:</text>
<rect x="24" y="260" width="210" height="64" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/><text x="38" y="286" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">out/sites_filled.csv</text><text x="38" y="308" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">11 cols x 9 rows</text>
<rect x="258" y="260" width="210" height="64" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/><text x="272" y="286" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">out/index.html</text><text x="272" y="308" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">page, SVG fallback</text>
<rect x="492" y="260" width="210" height="64" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/><text x="506" y="286" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">out/summary.txt</text><text x="506" y="308" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">per-site numbers</text>
<rect x="726" y="260" width="210" height="64" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/><text x="740" y="286" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">out/sky/*.txt</text><text x="740" y="308" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">57 S + 57 E per site</text>
<text x="24" y="368" fill="#94a3b8" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Sky domes, then nav runs again and embeds them:</text>
<rect x="24" y="380" width="260" height="64" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/><text x="38" y="406" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">sky/render.sh</text><text x="38" y="428" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">xvfb-run + ffmpeg</text>
<line x1="284" y1="412" x2="304" y2="412" stroke="#94a3b8" stroke-width="1.5"/><polygon points="304,412 296,408 296,416" fill="#94a3b8"/>
<rect x="304" y="380" width="260" height="64" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/><text x="318" y="406" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">sky/host.c + kernel</text><text x="318" y="428" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">OpenGL + GLSL fisheye</text>
<line x1="564" y1="412" x2="584" y2="412" stroke="#94a3b8" stroke-width="1.5"/><polygon points="584,412 576,408 576,416" fill="#94a3b8"/>
<rect x="584" y="380" width="220" height="64" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/><text x="598" y="406" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">out/sky/*.png</text><text x="598" y="428" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">640x640, 9 renders</text>
<line x1="804" y1="412" x2="824" y2="412" stroke="#94a3b8" stroke-width="1.5"/><polygon points="824,412 816,408 816,416" fill="#94a3b8"/>
<rect x="824" y="380" width="352" height="64" rx="10" fill="#111a2e" stroke="#4ade80" stroke-width="1.5"/><text x="838" y="406" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">out/index.html (final)</text><text x="838" y="428" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PNGs embedded base64</text>
<rect x="24" y="500" width="260" height="64" rx="10" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/><text x="38" y="526" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">demo/shoot.py</text><text x="38" y="548" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3 page screenshots</text>
<line x1="284" y1="532" x2="304" y2="532" stroke="#94a3b8" stroke-width="1.5"/><polygon points="304,532 296,528 296,536" fill="#94a3b8"/>
<rect x="304" y="500" width="260" height="64" rx="10" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/><text x="318" y="526" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">demo/build.py</text><text x="318" y="548" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ffmpeg concat + TTS</text>
<line x1="564" y1="532" x2="584" y2="532" stroke="#94a3b8" stroke-width="1.5"/><polygon points="584,532 576,528 576,536" fill="#94a3b8"/>
<rect x="584" y="500" width="320" height="64" rx="10" fill="#111a2e" stroke="#4ade80" stroke-width="1.5"/><text x="598" y="526" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">demo/lunar-navigator-demo-30s.mp4</text><text x="598" y="548" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">29.52 s, 1920x1080</text>
<text x="24" y="592" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">No terrain model, no route planner, no external service at run time: the page is a single static file.</text>
</svg>